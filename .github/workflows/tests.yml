# Corre los tests cada vez que subís algo.
# Si alguno falla, GitHub te avisa con una cruz roja en el repo.
name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar lo que hace falta
        run: pip install pytest

      - name: Correr los tests
        run: pytest -q
